<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GATE 2027 Countdown</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3MjDR1GCUzuWz4TnHQe-9CFicrTiBAcdjbMD87ULWHQ&s=10') no-repeat center center fixed;
    background-size:cover;
    color:#fff;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    animation:backgroundPulse 12s infinite alternate ease-in-out;
  }
  @keyframes backgroundPulse{
    from{filter:brightness(0.9) saturate(1)}
    to{filter:brightness(1.2) saturate(1.3)}
  }
  .card{
    width:min(900px,92vw);
    padding:48px 28px;
    text-align:center;
    background:rgba(21,29,51,0.85);
    border:1px solid #2c3857;
    border-radius:28px;
    box-shadow:0 20px 60px #0008;
    animation:fadeIn 1.2s ease-out;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }
  .welcome{
    font-size:26px;
    font-weight:700;
    margin-bottom:18px;
    background:linear-gradient(90deg,#ff9a9e,#fad0c4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 18px #ff9a9e99;
    animation:glow 2s infinite alternate;
  }
  @keyframes glow{
    from{text-shadow:0 0 8px #ff9a9e66}
    to{text-shadow:0 0 24px #ff9a9e}
  }
  h1{
    font-size:clamp(42px,8vw,82px);
    margin:12px 0 6px;
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:neonFlicker 3s infinite;
  }
  @keyframes neonFlicker{
    0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}
    20%,24%,55%{opacity:0.6}
  }
  .count{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .unit{
    min-width:130px;
    padding:22px 12px;
    background:#0e1527;
    border-radius:18px;
    transition:transform .3s ease,box-shadow .3s ease;
    animation:float 4s infinite ease-in-out;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  .num{
    font-size:clamp(38px,6vw,62px);
    font-weight:800;
    color:#4facfe;
    text-shadow:0 0 12px #00f2fe66;
  }
  .label{
    font-size:12px;
    letter-spacing:2px;
    color:#91a2c3;
    margin-top:5px;
  }
  .note{
    margin-top:30px;
    color:#d0d6e8;
    font-size:13px;
    line-height:1.5;
    font-style:italic;
  }
</style>
</head>
<body>
<div class="card">
  <div class="welcome">🎮 Welcome Devanand 🎮</div>
  <h1>GATE 2027</h1>
  <div class="date">Countdown target: 7 February 2027 · 9:30 AM IST</div>
  <div class="count">
    <div class="unit"><div class="num" id="days">--</div><div class="label">DAYS</div></div>
    <div class="unit"><div class="num" id="hours">--</div><div class="label">HOURS</div></div>
    <div class="unit"><div class="num" id="mins">--</div><div class="label">MINUTES</div></div>
    <div class="unit"><div class="num" id="secs">--</div><div class="label">SECONDS</div></div>
  </div>
  <div class="note">Level up your prep — the countdown updates every second.</div>
</div>
<script>
const target = new Date("2027-02-07T09:30:00+05:30").getTime();
function update(){
  let d = target - Date.now();
  if(d < 0) d = 0;
  const s = Math.floor(d/1000);
  document.getElementById("days").textContent = Math.floor(s/86400);
  document.getElementById("hours").textContent = String(Math.floor(s%86400/3600)).padStart(2,"0");
  document.getElementById("mins").textContent = String(Math.floor(s%3600/60)).padStart(2,"0");
  document.getElementById("secs").textContent = String(s%60).padStart(2,"0");
}
update(); setInterval(update,1000);
</script>
</body>
</html>
