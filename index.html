<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GATE 2027 Countdown</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3MjDR1GCUzuWz4TnHQe-9CFicrTiBAcdjbMD87ULWHQ&s=10') no-repeat center center fixed;
    background-size:cover;
    color:#fff;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    animation:backgroundPulse 12s infinite alternate ease-in-out;
  }
  @keyframes backgroundPulse{
    from{filter:brightness(0.9) saturate(1)}
    to{filter:brightness(1.2) saturate(1.3)}
  }
  .card{
    width:min(950px,95vw);
    padding:52px 32px;
    text-align:center;
    background:rgba(21,29,51,0.85);
    border:1px solid #2c3857;
    border-radius:28px;
    box-shadow:0 20px 60px #0008;
    animation:fadeIn 1.2s ease-out;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }
  .welcome{
    font-size:30px;
    font-weight:700;
    margin-bottom:18px;
    background:linear-gradient(90deg,#ff9a9e,#fad0c4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 18px #ff9a9e99;
    animation:glow 2s infinite alternate;
  }
  @keyframes glow{
    from{text-shadow:0 0 8px #ff9a9e66}
    to{text-shadow:0 0 24px #ff9a9e}
  }
  h1{
    font-size:clamp(48px,9vw,92px);
    margin:12px 0 6px;
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:neonFlicker 3s infinite;
  }
  @keyframes neonFlicker{
    0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}
    20%,24%,55%{opacity:0.6}
  }
  .count{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:28px;
  }
  .unit{
    min-width:150px;
    padding:28px 16px;
    background:#0e1527;
    border-radius:20px;
    transition:transform .3s ease,box-shadow .3s ease;
    animation:float 4s infinite ease-in-out;
    box-shadow:0 0 18px #00f2fe66;
    font-size:28px;
    font-weight:700;
  }
  .unit span{
    font-size:42px;
    font-weight:900;
    color:#00f2fe;
    text-shadow:0 0 12px #00f2feaa;
  }
  .unit:hover{
    transform:scale(1.12);
    box-shadow:0 0 28px #00f2feaa;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }
  .extra-links {
    margin-top: 36px;
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .extra-links a {
    padding:12px 22px;
    border-radius:24px;
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    color:#0e1527;
    text-decoration:none;
    font-weight:600;
    transition:all .3s ease;
    box-shadow:0 0 14px #00f2fe66;
  }
  .extra-links a:hover {
    background:linear-gradient(90deg,#ff9a9e,#fad0c4);
    color:#fff;
    box-shadow:0 0 20px #ff9a9eaa;
    transform:translateY(-3px);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="welcome">Hello Devanand 👋, Best of Luck for GATE 2027!</div>
    <h1>Countdown</h1>
    <div class="count">
      <div class="unit"><span id="days">000</span><br>Days</div>
      <div class="unit"><span id="hours">00</span><br>Hours</div>
      <div class="unit"><span id="minutes">00</span><br>Minutes</div>
      <div class="unit"><span id="seconds">00</span><br>Seconds</div>
    </div>

    <!-- Extra Links Section -->
    <div class="extra-links">
      <a href="https://gate2027.iitm.ac.in/" target="_blank">Official GATE Site</a>
      <a href="https://gate2027.iitm.ac.in/static/doc/GATE2027_Syllabus/CS_GATE2027_Syllabus.pdf" target="_blank">Syllabus</a>
      <a href="https://www.madeeasy.in/prep/home" target="_blank">Preparation Resources</a>
      <a href="https://chatgpt.com/s/t_6a800294af8c819189d28754f81969f9" target="_blank">Help</a>
      <a href="https://gate2027.iitm.ac.in/previous-year-papers" target="_blank">Previous Year Papers</a>
      <a href="https://docs.google.com/document/d/13_nrKmGVopRMFN7qK6HilsGJXGAkISDzQ48swMJR52M/edit?usp=sharing" target="_blank">click</a>
    </div>
  </div>

<script>
  // Countdown Timer Script
  const targetDate = new Date("February 6, 2027 09:00:00").getTime();
  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minutesEl = document.getElementById("minutes");
  const secondsEl = document.getElementById("seconds");

  setInterval(() => {
    const now = new Date().getTime();
    const distance = targetDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    daysEl.textContent = days;
    hoursEl.textContent = hours;
    minutesEl.textContent = minutes;
    secondsEl.textContent = seconds;
  }, 1000);
</script>
</body>
</html>
